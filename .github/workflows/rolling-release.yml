# gemeinstrom-Fork-Variante des upstream rolling-release-Workflows.
# Delta zum Upstream (eegfaktura/eegfaktura-admin-backend):
#   - Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-deploy Jobs entfernt (kein Deploy-Dispatch in fremde Orgs)
#   - build.sbt separat: dockerUsername/DockerAlias "gemeinstrom",
#     packageName "eegfaktura-admin-backend" -> ghcr.io/gemeinstrom/eegfaktura-admin-backend
# Aufgesetzt 2026-10-04 (Fork-Neuanlage admin-backend).

name: Docker Image CI (sbt-native-packager)

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
      - 'env/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main
    # a pull request that only changes the CHANGELOG (release PR) builds no image either (platform#239)
    paths-ignore: ['CHANGELOG.md']

jobs:
  build-and-push-image:
    # pull requests: not while a draft (pr-checks.yml tests drafts)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17.0.19+10'

      - name: Setup sbt
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Cache sbt
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/**.sbt', 'project/**.scala') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Login to Container Registry
        # Same-Org push nach ghcr.io/gemeinstrom/* — GITHUB_TOKEN reicht.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR via Docker/publishLocal) / Build+Push (push via Docker/publish)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sbt Docker/publishLocal
          else
            sbt Docker/publish
          fi
