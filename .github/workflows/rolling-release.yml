# gemeinstrom-Fork-Variante des upstream rolling-release-Workflows.
# Delta zum Upstream (eegfaktura/eegfaktura-admin-backend):
#   - Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-deploy Jobs entfernt (kein Deploy-Dispatch in fremde Orgs)
#   - build.sbt separat: dockerUsername/DockerAlias "gemeinstrom",
#     packageName "eegfaktura-admin-backend" -> ghcr.io/gemeinstrom/eegfaktura-admin-backend
# Aufgesetzt 2026-10-04 (Fork-Neuanlage admin-backend).

name: Docker Image CI (sbt-native-packager)

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
      - 'env/**'
    tags:
      - v*
  pull_request:
    branches:
      - master
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/**.sbt', 'project/**.scala') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Login to Container Registry
        # Same-Org push nach ghcr.io/gemeinstrom/* — GITHUB_TOKEN reicht.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR via Docker/publishLocal) / Build+Push (push via Docker/publish)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sbt Docker/publishLocal
          else
            sbt Docker/publish
          fi
